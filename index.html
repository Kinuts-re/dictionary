<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой словарь</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background: #f0f4f8; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
    .app { max-width: 900px; width: 100%; background: white; border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h1 { color: #1e293b; margin-bottom: 16px; }
    h2 { color: #1e293b; font-weight: 500; }
    h3 { color: #334155; margin: 12px 0 8px; }
    
    .flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .gap-8 { gap: 8px; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mb-8 { margin-bottom: 8px; }
    .mb-12 { margin-bottom: 12px; }
    .text-center { text-align: center; }
    .text-muted { color: #64748b; }
    .hidden { display: none !important; }
    .w-full { width: 100%; }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #16a34a; color: white; }
    .btn-success:hover { background: #15803d; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-warning { background: #f59e0b; color: #1e293b; }
    .btn-warning:hover { background: #d97706; }
    .btn-outline { background: #e2e8f0; color: #1e293b; }
    .btn-outline:hover { background: #cbd5e1; }
    .btn-sm { padding: 4px 14px; font-size: 0.8rem; }
    .btn-icon { padding: 6px 10px; font-size: 1rem; line-height: 1; }

    input {
      border: 1px solid #d1d5db;
      border-radius: 30px;
      padding: 10px 16px;
      font-size: 0.95rem;
      background: white;
    }
    input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
    .input-sm { padding: 6px 14px; font-size: 0.85rem; }

    .card { background: #f8fafc; border-radius: 16px; padding: 16px; margin-top: 12px; border: 1px solid #e2e8f0; }
    .word-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #e2e8f0; gap: 8px; }
    .word-item:last-child { border-bottom: none; }
    .word-item .word-text { flex: 1; }
    .word-item .word-actions { display: flex; gap: 4px; }

    .lang-chip {
      padding: 8px 20px;
      border-radius: 30px;
      background: #e2e8f0;
      cursor: pointer;
      transition: 0.15s;
      border: 2px solid transparent;
      font-weight: 500;
    }
    .lang-chip:hover { background: #cbd5e1; }
    .lang-chip.active { background: #2563eb; color: white; border-color: #2563eb; }

    .section-btn {
      padding: 6px 18px;
      border-radius: 30px;
      border: none;
      background: #e2e8f0;
      cursor: pointer;
      transition: 0.15s;
    }
    .section-btn.active { background: #2563eb; color: white; }
    .section-btn:hover { background: #cbd5e1; }
    .section-btn.active:hover { background: #1d4ed8; }

    .flashcard-box {
      background: white;
      border-radius: 28px;
      padding: 30px 20px;
      border: 1px solid #e2e8f0;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .flashcard-word { font-size: 2.2rem; font-weight: 500; color: #0f172a; }
    .flashcard-translation { font-size: 1.6rem; color: #334155; margin-top: 8px; }
    .badge { background: #dbeafe; color: #1e3a8a; border-radius: 40px; padding: 2px 16px; font-size: 0.8rem; }

    #authError { color: #b91c1c; margin-top: 8px; }

    /* Кнопка установки PWA */
    #installBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
      box-shadow: 0 8px 20px rgba(37,99,235,0.4);
      z-index: 1000;
      display: none;
    }
    #installBtn:hover { background: #1d4ed8; }

    @media (max-width: 600px) {
      .app { padding: 16px; }
      .flashcard-word { font-size: 1.6rem; }
      .flashcard-translation { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <!-- АВТОРИЗАЦИЯ -->
  <div id="authScreen">
    <h1>🔐 Вход / Регистрация</h1>
    <div class="flex" style="margin-bottom: 8px;">
      <input type="email" id="authEmail" placeholder="Email" style="flex:1;">
      <input type="password" id="authPassword" placeholder="Пароль" style="flex:1;">
    </div>
    <div class="flex gap-8">
      <button class="btn btn-primary" id="loginBtn">Войти</button>
      <button class="btn btn-outline" id="registerBtn">Зарегистрироваться</button>
    </div>
    <div id="authError"></div>
  </div>

  <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
  <div id="mainScreen" class="hidden">
    <div class="flex-between">
      <h2>📚 Мой словарь</h2>
      <div class="flex">
        <span class="badge" id="userEmailBadge">user@mail.com</span>
        <button class="btn btn-outline btn-sm" id="logoutBtn">выйти</button>
      </div>
    </div>

    <!-- УПРАВЛЕНИЕ ЯЗЫКАМИ -->
    <div class="card">
      <div class="flex" style="margin-bottom: 8px;">
        <input id="newLangInput" placeholder="Новый язык (например, french)" style="flex:1;" class="input-sm">
        <button class="btn btn-success btn-sm" id="addLangBtn">➕ Добавить</button>
      </div>
      <div id="langList" class="flex" style="gap:6px;"></div>
    </div>

    <!-- РАЗДЕЛЫ -->
    <div class="flex gap-8" style="margin: 12px 0 8px;">
      <button class="section-btn active" data-section="dictionary">📖 Словарь</button>
      <button class="section-btn" data-section="flashcards">🃏 Карточки</button>
      <button class="section-btn" data-section="learned">✅ Выучено</button>
      <button class="section-btn" data-section="phrases">💬 Фразы</button>
    </div>

    <!-- СЛОВАРЬ -->
    <div id="dictionarySection" class="section-container">
      <div class="flex" style="margin: 12px 0 6px;">
        <input type="text" id="newWordInput" placeholder="слово" style="flex:1;">
        <input type="text" id="newTranslationInput" placeholder="перевод" style="flex:1;">
        <button class="btn btn-success" id="addWordBtn">➕</button>
      </div>
      <div id="dictionaryList" class="card"></div>
    </div>

    <!-- КАРТОЧКИ -->
    <div id="flashcardsSection" class="section-container hidden">
      <div class="flashcard-box">
        <div id="flashcardContent">
          <div class="flashcard-word" id="fcWord">слово</div>
          <div class="flashcard-translation hidden" id="fcTranslation">перевод</div>
          <button class="btn btn-outline btn-sm" id="fcSpeak" style="margin-top:12px;">🔊 Прослушать</button>
        </div>
      </div>
      <div class="flex space-between" style="margin-top: 14px;">
        <div class="flex gap-8">
          <button class="btn btn-success btn-sm" id="fcRemember">✅ помню</button>
          <button class="btn btn-warning btn-sm" id="fcForget">❌ не помню</button>
          <button class="btn btn-outline btn-sm" id="fcNever">🚫 не учить</button>
        </div>
        <span id="fcCounter" class="badge">0 осталось</span>
      </div>
    </div>

    <!-- ВЫУЧЕННО -->
    <div id="learnedSection" class="section-container hidden">
      <h3>📊 Уже выучено <span id="learnedCount">0</span> слов</h3>
      <div id="learnedList" class="card"></div>
    </div>

    <!-- ФРАЗЫ -->
    <div id="phrasesSection" class="section-container hidden">
      <div class="flex" style="margin: 12px 0 6px;">
        <input type="text" id="newPhraseInput" placeholder="фраза" style="flex:1;">
        <input type="text" id="newPhraseTranslationInput" placeholder="перевод" style="flex:1;">
        <button class="btn btn-success" id="addPhraseBtn">➕</button>
      </div>
      <div id="phraseList" class="card"></div>
    </div>
  </div>
</div>

<!-- Кнопка установки PWA -->
<button id="installBtn">📲 Установить приложение</button>

<script>
(function() {
  // ===== SUPABASE =====
  const SUPABASE_URL = 'https://ethstgtnpbvilqqtrfap.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_CgP6FCcX4DDnjzrC6X_2Og_7Cvcr_aA';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ===== ЯЗЫКИ ДЛЯ ОЗВУЧКИ =====
  const SPEECH_LANGS = {
    english: 'en-US',
    german: 'de-DE',
    french: 'fr-FR',
    spanish: 'es-ES',
    italian: 'it-IT',
    russian: 'ru-RU',
    japanese: 'ja-JP',
    chinese: 'zh-CN',
    portuguese: 'pt-PT',
    korean: 'ko-KR'
  };

  // ===== СОСТОЯНИЕ =====
  let currentUser = null;
  let currentLang = 'english';
  let currentSection = 'dictionary';
  let words = [];
  let learned = [];
  let phrases = [];
  let flashcardQueue = [];
  let currentCardIndex = 0;

  // ===== DOM =====
  const authScreen = document.getElementById('authScreen');
  const mainScreen = document.getElementById('mainScreen');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authError = document.getElementById('authError');
  const loginBtn = document.getElementById('loginBtn');
  const registerBtn = document.getElementById('registerBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const userEmailBadge = document.getElementById('userEmailBadge');

  const langList = document.getElementById('langList');
  const newLangInput = document.getElementById('newLangInput');
  const addLangBtn = document.getElementById('addLangBtn');

  const sectionBtns = document.querySelectorAll('.section-btn');
  const dictSection = document.getElementById('dictionarySection');
  const flashcardsSection = document.getElementById('flashcardsSection');
  const learnedSection = document.getElementById('learnedSection');
  const phrasesSection = document.getElementById('phrasesSection');

  const dictionaryList = document.getElementById('dictionaryList');
  const newWordInput = document.getElementById('newWordInput');
  const newTranslationInput = document.getElementById('newTranslationInput');
  const addWordBtn = document.getElementById('addWordBtn');

  const fcWord = document.getElementById('fcWord');
  const fcTranslation = document.getElementById('fcTranslation');
  const fcSpeak = document.getElementById('fcSpeak');
  const fcRemember = document.getElementById('fcRemember');
  const fcForget = document.getElementById('fcForget');
  const fcNever = document.getElementById('fcNever');
  const fcCounter = document.getElementById('fcCounter');

  const learnedList = document.getElementById('learnedList');
  const learnedCount = document.getElementById('learnedCount');

  const newPhraseInput = document.getElementById('newPhraseInput');
  const newPhraseTranslationInput = document.getElementById('newPhraseTranslationInput');
  const addPhraseBtn = document.getElementById('addPhraseBtn');
  const phraseList = document.getElementById('phraseList');

  const installBtn = document.getElementById('installBtn');

  // ===== ОЗВУЧКА =====
  function speak(text, langCode) {
    if (!('speechSynthesis' in window)) {
      alert('Ваш браузер не поддерживает озвучку');
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = langCode || SPEECH_LANGS[currentLang] || 'en-US';
    utterance.rate = 0.9;
    utterance.pitch = 1;
    window.speechSynthesis.speak(utterance);
  }

  // ===== ВСПОМОГАТЕЛЬНЫЕ =====
  function showAuthError(msg) { authError.textContent = msg; }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function getLangEmoji(lang) {
    const emojis = { english: '🇬🇧', german: '🇩🇪', french: '🇫🇷', spanish: '🇪🇸', italian: '🇮🇹', russian: '🇷🇺', japanese: '🇯🇵', chinese: '🇨🇳', portuguese: '🇵🇹', korean: '🇰🇷' };
    return emojis[lang.toLowerCase()] || '🌍';
  }

  function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  // ===== ЗАГРУЗКА ДАННЫХ =====
  async function loadData() {
    if (!currentUser) return;

    const { data: langData, error: langErr } = await supabase
      .from('user_languages')
      .select('lang')
      .eq('user_id', currentUser.id);
    if (langErr) console.error('Error loading languages:', langErr);
    
    if (!langData || langData.length === 0) {
      const defaultLangs = ['english', 'german'];
      for (const lang of defaultLangs) {
        await supabase.from('user_languages').insert({
          user_id: currentUser.id,
          lang: lang
        });
      }
      const { data: newLangData } = await supabase
        .from('user_languages')
        .select('lang')
        .eq('user_id', currentUser.id);
      renderLanguages(newLangData || []);
    } else {
      renderLanguages(langData);
    }

    const { data: wordsData, error: wErr } = await supabase
      .from('words')
      .select('*')
      .eq('user_id', currentUser.id)
      .eq('lang', currentLang);
    if (wErr) console.error(wErr);
    words = wordsData || [];

    const { data: learnedData, error: lErr } = await supabase
      .from('learned')
      .select('*')
      .eq('user_id', currentUser.id)
      .eq('lang', currentLang);
    if (lErr) console.error(lErr);
    learned = learnedData || [];

    const { data: phrasesData, error: pErr } = await supabase
      .from('phrases')
      .select('*')
      .eq('user_id', currentUser.id)
      .eq('lang', currentLang);
    if (pErr) console.error(pErr);
    phrases = phrasesData || [];

    const learnedIds = new Set(learned.map(w => w.word_id));
    flashcardQueue = words.filter(w => !learnedIds.has(w.id));
    flashcardQueue = shuffleArray(flashcardQueue);
    currentCardIndex = 0;

    renderAll();
  }

  // ===== ОТРИСОВКА ЯЗЫКОВ =====
  function renderLanguages(langData) {
    const langs = langData.map(item => item.lang);
    if (!langs.includes(currentLang) && langs.length > 0) {
      currentLang = langs[0];
    }
    
    langList.innerHTML = langs.map(lang => 
      `<div class="lang-chip ${lang === currentLang ? 'active' : ''}" onclick="switchLanguage('${lang}')">
        ${getLangEmoji(lang)} ${capitalize(lang)}
        <button onclick="event.stopPropagation(); deleteLanguage('${lang}')" 
                style="background:none; border:none; color:#dc2626; cursor:pointer; margin-left:4px; font-size:1.1rem;">✕</button>
      </div>`
    ).join('');
  }

  // ===== ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА =====
  window.switchLanguage = async function(lang) {
    if (lang === currentLang) return;
    currentLang = lang;
    await loadData();
  };

  // ===== ДОБАВЛЕНИЕ ЯЗЫКА =====
  addLangBtn.addEventListener('click', async function() {
    const newLang = newLangInput.value.trim().toLowerCase();
    if (!newLang) { alert('Введите название языка'); return; }
    
    const { data: existing } = await supabase
      .from('user_languages')
      .select('lang')
      .eq('user_id', currentUser.id)
      .eq('lang', newLang);
    
    if (existing && existing.length > 0) {
      alert('Такой язык уже есть');
      return;
    }

    const { error } = await supabase
      .from('user_languages')
      .insert({ user_id: currentUser.id, lang: newLang });
    
    if (error) { alert('Ошибка: ' + error.message); return; }
    
    newLangInput.value = '';
    await loadData();
    switchLanguage(newLang);
  });

  // ===== УДАЛЕНИЕ ЯЗЫКА =====
  window.deleteLanguage = async function(lang) {
    const { data: langs } = await supabase
      .from('user_languages')
      .select('lang')
      .eq('user_id', currentUser.id);
    
    if (langs.length <= 1) {
      alert('Нельзя удалить последний язык');
      return;
    }

    if (!confirm(`Удалить язык "${capitalize(lang)}" и все его данные?`)) return;

    await supabase.from('user_languages').delete().eq('user_id', currentUser.id).eq('lang', lang);
    await supabase.from('words').delete().eq('user_id', currentUser.id).eq('lang', lang);
    await supabase.from('learned').delete().eq('user_id', currentUser.id).eq('lang', lang);
    await supabase.from('phrases').delete().eq('user_id', currentUser.id).eq('lang', lang);

    if (currentLang === lang) {
      const { data: remaining } = await supabase
        .from('user_languages')
        .select('lang')
        .eq('user_id', currentUser.id);
      if (remaining && remaining.length > 0) {
        currentLang = remaining[0].lang;
      }
    }
    await loadData();
  };

  // ===== СЛОВАРЬ =====
  function renderDictionary() {
    const learnedIds = new Set(learned.map(l => l.word_id));
    const activeWords = words.filter(w => !learnedIds.has(w.id));
    
    if (!activeWords.length) {
      dictionaryList.innerHTML = '<div class="text-muted text-center">Словарь пуст. Добавьте слова!</div>';
      return;
    }
    
    const sorted = [...activeWords].sort((a,b) => a.word.localeCompare(b.word));
    dictionaryList.innerHTML = sorted.map(w => `
      <div class="word-item">
        <span class="word-text"><strong>${escapeHtml(w.word)}</strong> — ${escapeHtml(w.translation)}</span>
        <div class="word-actions">
          <button class="btn btn-outline btn-icon speak-word" data-word="${escapeHtml(w.word)}" title="Озвучить">🔊</button>
          <button class="btn btn-outline btn-icon delete-word" data-id="${w.id}" title="Удалить">🗑</button>
        </div>
      </div>
    `).join('');
    
    document.querySelectorAll('.speak-word').forEach(btn => {
      btn.addEventListener('click', function() {
        speak(this.dataset.word, SPEECH_LANGS[currentLang]);
      });
    });
    
    document.querySelectorAll('.delete-word').forEach(btn => {
      btn.addEventListener('click', async function() {
        const id = this.dataset.id;
        if (!confirm('Удалить слово?')) return;
        await supabase.from('words').delete().eq('id', id);
        await supabase.from('learned').delete().eq('word_id', id);
        await loadData();
      });
    });
  }

  // ===== КАРТОЧКИ =====
  function renderFlashcards() {
    if (!flashcardQueue.length) {
      fcWord.textContent = '🎉 Все слова выучены!';
      fcTranslation.classList.add('hidden');
      fcSpeak.classList.add('hidden');
      fcCounter.textContent = '0 осталось';
      return;
    }
    if (currentCardIndex >= flashcardQueue.length) {
      currentCardIndex = 0;
    }
    const word = flashcardQueue[currentCardIndex];
    if (word) {
      fcWord.textContent = word.word;
      fcTranslation.textContent = word.translation;
      fcTranslation.classList.add('hidden');
      fcSpeak.classList.remove('hidden');
      fcCounter.textContent = `${flashcardQueue.length} осталось`;
    }
  }

  // ===== ВЫУЧЕННЫЕ =====
  function renderLearned() {
    const count = learned.length;
    learnedCount.textContent = count;
    if (!count) {
      learnedList.innerHTML = '<div class="text-muted text-center">Нет выученных слов</div>';
      return;
    }
    learnedList.innerHTML = learned.map(w => `
      <div class="word-item">
        <span class="word-text"><strong>${escapeHtml(w.word)}</strong> — ${escapeHtml(w.translation)}</span>
        <div class="word-actions">
          <button class="btn btn-outline btn-icon speak-word" data-word="${escapeHtml(w.word)}" title="Озвучить">🔊</button>
          <button class="btn btn-outline btn-sm unlearn-word" data-id="${w.id}">↩️ вернуть</button>
        </div>
      </div>
    `).join('');
    
    document.querySelectorAll('.speak-word').forEach(btn => {
      btn.addEventListener('click', function() {
        speak(this.dataset.word, SPEECH_LANGS[currentLang]);
      });
    });
    
    document.querySelectorAll('.unlearn-word').forEach(btn => {
      btn.addEventListener('click', async function() {
        const id = this.dataset.id;
        if (!confirm('Вернуть слово в словарь?')) return;
        const { error } = await supabase.from('learned').delete().eq('id', id);
        if (error) { alert('Ошибка: ' + error.message); return; }
        await loadData();
      });
    });
  }

  // ===== ФРАЗЫ =====
  function renderPhrases() {
    if (!phrases.length) {
      phraseList.innerHTML = '<div class="text-muted text-center">Нет фраз. Добавьте!</div>';
      return;
    }
    phraseList.innerHTML = phrases.map(p => `
      <div class="word-item">
        <span class="word-text"><strong>${escapeHtml(p.phrase)}</strong> — ${escapeHtml(p.translation)}</span>
        <div class="word-actions">
          <button class="btn btn-outline btn-icon speak-word" data-word="${escapeHtml(p.phrase)}" title="Озвучить">🔊</button>
          <button class="btn btn-outline btn-icon delete-phrase" data-id="${p.id}" title="Удалить">🗑</button>
        </div>
      </div>
    `).join('');
    
    document.querySelectorAll('.speak-word').forEach(btn => {
      btn.addEventListener('click', function() {
        speak(this.dataset.word, SPEECH_LANGS[currentLang]);
      });
    });
    
    document.querySelectorAll('.delete-phrase').forEach(btn => {
      btn.addEventListener('click', async function() {
        const id = this.dataset.id;
        if (!confirm('Удалить фразу?')) return;
        await supabase.from('phrases').delete().eq('id', id);
        await loadData();
      });
    });
  }

  function renderAll() {
    renderDictionary();
    renderFlashcards();
    renderLearned();
    renderPhrases();
  }

  // ===== ДОБАВЛЕНИЕ СЛОВА =====
  addWordBtn.addEventListener('click', async function() {
    const word = newWordInput.value.trim();
    const translation = newTranslationInput.value.trim();
    if (!word || !translation) { alert('Заполните оба поля'); return; }
    
    const { error } = await supabase.from('words').insert({
      user_id: currentUser.id,
      lang: currentLang,
      word,
      translation
    });
    if (error) { alert('Ошибка: ' + error.message); return; }
    
    newWordInput.value = '';
    newTranslationInput.value = '';
    await loadData();
  });

  // ===== ДОБАВЛЕНИЕ ФРАЗЫ =====
  addPhraseBtn.addEventListener('click', async function() {
    const phrase = newPhraseInput.value.trim();
    const translation = newPhraseTranslationInput.value.trim();
    if (!phrase || !translation) { alert('Заполните оба поля'); return; }
    
    const { error } = await supabase.from('phrases').insert({
      user_id: currentUser.id,
      lang: currentLang,
      phrase,
      translation
    });
    if (error) { alert('Ошибка: ' + error.message); return; }
    
    newPhraseInput.value = '';
    newPhraseTranslationInput.value = '';
    await loadData();
  });

  // ===== ОЗВУЧКА КАРТОЧКИ =====
  fcSpeak.addEventListener('click', function() {
    const word = flashcardQueue[currentCardIndex];
    if (!word) return;
    speak(word.word, SPEECH_LANGS[currentLang]);
  });

  // ===== КНОПКИ КАРТОЧЕК =====
  fcRemember.addEventListener('click', function() {
    const word = flashcardQueue[currentCardIndex];
    if (!word) return;
    fcTranslation.classList.remove('hidden');
    setTimeout(() => {
      flashcardQueue.splice(currentCardIndex, 1);
      if (flashcardQueue.length === 0) {
        renderFlashcards();
        return;
      }
      if (currentCardIndex >= flashcardQueue.length) currentCardIndex = 0;
      renderFlashcards();
    }, 2000);
  });

  fcForget.addEventListener('click', function() {
    const word = flashcardQueue[currentCardIndex];
    if (!word) return;
    fcTranslation.classList.remove('hidden');
    setTimeout(() => {
      const moved = flashcardQueue.splice(currentCardIndex, 1)[0];
      flashcardQueue.push(moved);
      currentCardIndex = 0;
      renderFlashcards();
    }, 2000);
  });

  fcNever.addEventListener('click', async function() {
    const word = flashcardQueue[currentCardIndex];
    if (!word) return;
    fcTranslation.classList.remove('hidden');
    setTimeout(async () => {
      const { data: existing } = await supabase
        .from('learned')
        .select('id')
        .eq('user_id', currentUser.id)
        .eq('word_id', word.id);
      
      if (!existing || existing.length === 0) {
        const { error } = await supabase.from('learned').insert({
          user_id: currentUser.id,
          lang: currentLang,
          word_id: word.id,
          word: word.word,
          translation: word.translation
        });
        if (error) { alert('Ошибка: ' + error.message); return; }
      }
      await loadData();
    }, 2000);
  });

  // ===== ПЕРЕКЛЮЧЕНИЕ РАЗДЕЛОВ =====
  sectionBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      sectionBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      const sec = this.dataset.section;
      currentSection = sec;
      
      document.querySelectorAll('.section-container').forEach(el => el.classList.add('hidden'));
      if (sec === 'dictionary') dictSection.classList.remove('hidden');
      else if (sec === 'flashcards') flashcardsSection.classList.remove('hidden');
      else if (sec === 'learned') learnedSection.classList.remove('hidden');
      else if (sec === 'phrases') phrasesSection.classList.remove('hidden');
      
      renderAll();
    });
  });

  // ===== АВТОРИЗАЦИЯ =====
  async function handleAuth(email, password, isLogin) {
    try {
      let result;
      if (isLogin) {
        result = await supabase.auth.signInWithPassword({ email, password });
      } else {
        result = await supabase.auth.signUp({ email, password });
      }
      if (result.error) throw result.error;
      
      currentUser = result.data.user;
      userEmailBadge.textContent = currentUser.email;
      authScreen.classList.add('hidden');
      mainScreen.classList.remove('hidden');
      await loadData();
    } catch (e) {
      showAuthError(e.message);
    }
  }

  loginBtn.addEventListener('click', () => {
    handleAuth(authEmail.value, authPassword.value, true);
  });

  registerBtn.addEventListener('click', () => {
    handleAuth(authEmail.value, authPassword.value, false);
  });

  logoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut();
    currentUser = null;
    authScreen.classList.remove('hidden');
    mainScreen.classList.add('hidden');
    authEmail.value = '';
    authPassword.value = '';
    authError.textContent = '';
  });

  // ===== ПРОВЕРКА СЕССИИ =====
  (async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      currentUser = session.user;
      userEmailBadge.textContent = currentUser.email;
      authScreen.classList.add('hidden');
      mainScreen.classList.remove('hidden');
      await loadData();
    }
  })();

  // ===== PWA: УСТАНОВКА =====
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('PWA install:', outcome);
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });

  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
    console.log('PWA установлено');
  });

  // ===== PWA: SERVICE WORKER =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
    });
  }

})();
</script>
</body>
</html>
